org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Параллельная сборка выключена намеренно. Модуль в проекте один, выигрыша
# от неё нет, а одновременная запись в кэш артефактов на Windows приводит к
# «Could not move temporary workspace ... AccessDeniedException»: файл ещё
# держит антивирус, а Gradle уже переименовывает каталог.
org.gradle.parallel=false
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
