# /etc/nginx/sites-available/smartsale
#
# Порт 8010 занят приложением, наружу смотрит только nginx.

server {
    listen 80;
    server_name _;

    access_log /var/log/nginx/smartsale.access.log;
    error_log  /var/log/nginx/smartsale.error.log;

    # Пакет синхронизации с телефона за день без связи бывает крупным.
    client_max_body_size 8m;

    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Телефон на краю сети отвечает медленно, обрывать его рано незачем.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Кабинет показывает всю клиентскую базу и деньги. Пока нет HTTPS,
    # разумно ограничить его офисными адресами, оставив API открытым —
    # агенты ходят с мобильного интернета, их адреса непредсказуемы.
    #
    # Адресов у офиса два не по ошибке: машина выходит через два канала и
    # переключается между ними в пределах сессии.
    #
    # location / {
    #     allow 5.133.120.66;
    #     allow 213.230.127.101;
    #     deny all;
    #     ...
    # }
    # location /api/ { proxy_pass http://127.0.0.1:8010; ... }
}
